<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ирина, с Днём Рождения!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ВАЖНО: подключаем ИМЕННО style_v2.css -->
  <link rel="stylesheet" href="./style_v2.css">
</head>
<body>

<main class="stage">
  <section class="card-wrap">

    <!-- КОНВЕРТ -->
    <button class="envelope" id="envelope">
      <span class="env-back"></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="stamp">💌</span>
      <span class="hint">Нажми, чтобы открыть…</span>
    </button>

    <!-- ОТКРЫТКА -->
    <article class="letter">
      <header class="letter__head">
        <h1>Ирина, с Днём Рождения!</h1>
        <p class="sub">Немного магии — просто так ✨</p>
      </header>

      <div class="letter__body">
        <p class="wish" id="wishText"></p>

        <!-- ТОРТ -->
        <div class="cake-area">
          <div class="cake-wrap">

            <div class="candle">
              <div class="candle__body"></div>
              <div class="wick"></div>
              <div class="flame" id="flame"></div>
            </div>

            <button class="cake" id="cake">
              <div class="cake__top"></div>
              <div class="cake__mid"></div>
              <div class="cake__base"></div>
            </button>

            <div class="tip">Нажми на торт ✨</div>
          </div>
        </div>

        <div class="controls">
          <div class="steps">
            1) Загадай желание · 2) Просто улыбнись 🙂
          </div>

          <div class="actions">
            <button class="btn" id="randomBtn">Ещё пожелание</button>
          </div>
        </div>

        <p class="footer">Свеча уже горит. Загадай желание… 😊</p>
      </div>
    </article>

  </section>
</main>

<script src="./script.js"></script>
</body>
</html>
