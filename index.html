<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>С Днём Рождения, Ирина!</title>
  <link rel="stylesheet" href="./style.css?v=20">
</head>
<body>

<main class="stage">
  <section class="card-wrap">

    <!-- КОНВЕРТ -->
    <button class="envelope" id="envelope">
      <span class="env-back"></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="stamp">💌</span>
      <span class="hint" id="hint">Нажми, чтобы открыть…</span>
    </button>

    <!-- ОТКРЫТКА -->
    <article class="letter" id="letter">
      <header class="letter__head">
        <div class="badge">🎉</div>
        <h1>Ирина, с Днём Рождения!</h1>
        <p class="sub">Немного магии — просто так ✨</p>
      </header>

      <div class="letter__body">
        <p class="wish" id="wishText"></p>

        <!-- ТОРТ -->
        <div class="cake-area">
          <div class="cake-wrap">

            <div class="candle">
              <div class="candle__body"></div>
              <div class="wick" id="wick"></div>
              <div class="flame" id="flame"></div>
              <div class="smoke" id="smoke"></div>
            </div>

            <button class="cake" id="cake">
              <div class="cake__top"></div>
              <div class="cake__mid"></div>
              <div class="cake__base"></div>
              <div class="sprinkles"></div>
            </button>

            <div class="tip">Нажми на торт ✨</div>
          </div>
        </div>

        <!-- УПРАВЛЕНИЕ -->
        <div class="controls">
          <div class="steps">
            <span>1) Загадай желание</span>
            <span>•</span>
            <span>2) Включи микрофон</span>
            <span>•</span>
            <span>3) Подуй</span>
          </div>

          <div class="actions">
            <button class="btn" id="randomBtn">Ещё пожелание</button>
            <button class="btn btn2" id="partyBtn">Праздник!</button>
            <button class="btn btn3" id="micBtn">Микрофон: выкл 🎙️</button>
          </div>

          <div class="mic-status" id="micStatus">Микрофон выключен</div>
        </div>

        <p class="footer" id="footerMsg"></p>

        <!-- ФИНАЛ -->
        <div class="ending" id="ending" hidden>
          <p>Пусть желание обязательно сбудется ✨</p>
          <button class="btn btn2" id="closeCard">Закрыть открытку</button>
        </div>
      </div>
    </article>

  </section>
</main>

<canvas id="fx"></canvas>
<script src="./script.js?v=20"></script>
</body>
</html>
