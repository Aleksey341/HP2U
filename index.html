<!-- index.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>С Днём Рождения, Ирина!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <section class="card-wrap">
      <button class="envelope" id="envelope" type="button" aria-label="Открыть конверт">
        <span class="env-back"></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="stamp" aria-hidden="true">💌</span>
        <span class="hint" id="hint">Нажми, чтобы открыть…</span>
      </button>

      <article class="letter" id="letter" aria-live="polite">
        <button class="btn-close" id="closeLetterBtn" type="button" aria-label="Закрыть">✕</button>
        <header class="letter__head">
          <div class="badge">🎉</div>
          <h1>Ирина, с Днём Рождения!</h1>
          <p class="sub">Торт, свеча и маленькая магия — без лишних кнопок 🙂</p>
        </header>

        <div class="letter__body">
          <p id="wishText" class="wish"></p>

          <div class="cake-area">
            <div class="tip" id="tip">Нажми на торт — будут эффекты ✨</div>
            <div class="cake-wrap">
              <div class="candle" aria-hidden="true">
                <div class="candle__body"></div>
                <div class="wick" id="wick" aria-hidden="true"></div>
                <div class="flame on" id="flame" aria-hidden="true"></div>
                <div class="smoke" id="smoke" aria-hidden="true"></div>
              </div>

              <button class="cake" id="cake" type="button" aria-label="Нажми на торт">
                <div class="cake__top"></div>
                <div class="cake__mid"></div>
                <div class="cake__base"></div>
                <div class="sprinkles" aria-hidden="true"></div>
              </button>

            </div>
          </div>

          <div class="controls">
            <div class="steps" id="steps">
              <span class="step">1) Загадай желание</span>
              <span class="dot">•</span>
              <span class="step">2) Включи микрофон</span>
              <span class="dot">•</span>
              <span class="step">3) Подуй, чтобы задуть свечу</span>
            </div>

            <div class="actions">
            </div>

            <div class="mic-status">Микрофон: <span id="micToggle" class="mic-toggle">выключен</span></div>

            <label class="toggle">
              <input id="soundToggle" type="checkbox" />
              <span>тихий режим (без звуков)</span>
            </label>
          </div>

          <p class="footer" id="footerMsg"></p>

          <div class="ending" id="ending" hidden>
            <p class="ending-text">
              Спасибо, что остановилась на секунду.<br>
              Пусть желание обязательно сбудется ✨
            </p>
            <button class="btn btn2" id="closeCard" type="button">Закрыть открытку</button>
          </div>
        </div>
      </article>
    </section>

    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
